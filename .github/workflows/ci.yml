name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Each action is pinned to the commit of a release tag. To check a pin, run the command in the
# comment above it: the commit is the line that ends with `^{}`, or the only line if there is
# none.
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # git ls-remote --tags https://github.com/actions/checkout 'v7.0.1' 'v7.0.1^{}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # git ls-remote --tags https://github.com/cachix/install-nix-action 'v31.11.5' 'v31.11.5^{}'
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop -c lake --wfail test
