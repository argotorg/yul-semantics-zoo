# Generated by: lake exe verso setup-literate
# To update after upgrading Verso, re-run the command above.
#
# Each action is pinned to the commit of a release tag. To check a pin, run the command in the
# comment above it: the commit is the line that ends with `^{}`, or the only line if there is
# none.

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Allows manual deployment from the Actions tab
    workflow_dispatch:

# Permissions required for GitHub Pages deployment:
#   contents:read  — to check out the repository
#   pages:write    — to publish to GitHub Pages
#   id-token:write — for OIDC authentication with the Pages deployment API
#     (GitHub Pages uses short-lived OIDC tokens instead of long-lived secrets)
permissions:
    contents: read
    pages: write
    id-token: write

# Prevent concurrent deployments: if a new push arrives while a deployment
# is in progress, the new one waits (cancel-in-progress: false) rather than
# canceling the running deployment, which could leave the site in a broken state.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            # git ls-remote --tags https://github.com/actions/checkout 'v6.1.0' 'v6.1.0^{}'
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            # leanprover/lean-action handles:
            #   - Installing elan (the Lean version manager)
            #   - Reading lean-toolchain to select the right Lean version
            #   - Caching .lake for faster subsequent builds
            # We disable its default build/test since we only need :literateHtml.
            # git ls-remote --tags https://github.com/leanprover/lean-action 'v1.7.1' 'v1.7.1^{}'
            - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
              with:
                  build: false
                  test: false

            - name: Build literate site
              id: build
              run: echo "path=$(lake query :literateHtml)" >> "$GITHUB_OUTPUT"

            # git ls-remote --tags https://github.com/actions/upload-pages-artifact 'v3.0.1' 'v3.0.1^{}'
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
              with:
                  path: ${{ steps.build.outputs.path }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            # git ls-remote --tags https://github.com/actions/deploy-pages 'v4.0.5' 'v4.0.5^{}'
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
