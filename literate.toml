title = "Yul"

[modules."YulSemnaticsZoo.EVM"]
title = "EVM"

[modules."YulSemnaticsZoo"]
title = "Introduction"

[modules."YulSemnaticsZoo.Yul.Syntax"]
title = "Yul: syntax"

