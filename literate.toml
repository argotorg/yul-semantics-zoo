# The literate document: `lake query :literateHtml` builds it, and the GitHub workflow
# verso-literate-pages.yml publishes it.

landing_page = "YulSemnaticsZoo"

# the lemmas are long proof scripts; the theorems that they prove are in the Theorems modules
exclude = [
  "YulSemnaticsZoo.Yul.Syntax.Lemmas",
  "YulSemnaticsZoo.Yul.Semantics.Clocked.Lemmas",
  "YulSemnaticsZoo.Yul.Semantics.Clocked.Tactic",
  "YulSemnaticsZoo.EVM.Syntax.Lemmas",
  "YulSemnaticsZoo.Compiler.Lemmas",
]

hide_commands = ["import", "open", "namespace", "end", "set_option"]

# the reading order; `order` applies to each level (`order_children` with keys like
# "YulSemnaticsZoo.Yul" does not match nested modules in Verso v4.35.0). Each folder in the
# order has a module (for example YulSemnaticsZoo/Yul/Syntax.lean): Verso warns for an ordered
# name that is not a module.
order = [
  "YulSemnaticsZoo.Yul",
  "YulSemnaticsZoo.EVM",
  "YulSemnaticsZoo.Semantics",
  "YulSemnaticsZoo.Compiler",
  "YulSemnaticsZoo.Yul.Syntax",
  "YulSemnaticsZoo.Yul.Semantics",
  "YulSemnaticsZoo.Yul.Syntax.Syntax",
  "YulSemnaticsZoo.Yul.Syntax.Dialect",
  "YulSemnaticsZoo.Yul.Syntax.EVM",
  "YulSemnaticsZoo.Yul.Syntax.Lexer",
  "YulSemnaticsZoo.Yul.Syntax.Printer",
  "YulSemnaticsZoo.Yul.Syntax.Parser",
  "YulSemnaticsZoo.Yul.Syntax.Valid",
  "YulSemnaticsZoo.Yul.Syntax.Theorems",
  "YulSemnaticsZoo.Yul.Syntax.WellFormed",
  "YulSemnaticsZoo.Yul.Syntax.Quote",
  "YulSemnaticsZoo.Yul.Semantics.Clocked.Interp",
  "YulSemnaticsZoo.Yul.Semantics.Clocked.Theorems",
  "YulSemnaticsZoo.EVM.Syntax",
  "YulSemnaticsZoo.EVM.Semantics",
  "YulSemnaticsZoo.EVM.Syntax.Syntax",
  "YulSemnaticsZoo.EVM.Syntax.Printer",
  "YulSemnaticsZoo.EVM.Syntax.Theorems",
  "YulSemnaticsZoo.EVM.Semantics.Clocked.Step",
  "YulSemnaticsZoo.EVM.Semantics.Clocked.Gas",
  "YulSemnaticsZoo.EVM.Semantics.Clocked.Refinement",
  "YulSemnaticsZoo.Compiler.Compile",
  "YulSemnaticsZoo.Compiler.Correct",
]

# docstrings are prose: show them as text between the code boxes
docstrings_as_text = true

# code: colours (Jellybeans in dark mode, Solarized in light mode) and space between declarations
extra_css = ["doc/code.css"]

[[targets]]
library = "YulSemnaticsZoo"

